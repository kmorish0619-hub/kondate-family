/* ---------- 写真は必要になったときだけ読む ---------- */
function photosOf(id){ return PH[id]||{}; }
function ensurePhotos(id,after){
  if(PHLOAD[id]){ if(after)after(); return; }
  if(!DB){ PH[id]=(S.photos&&S.photos[id])||{}; PHLOAD[id]=1; if(after)after(); return; }
  DB.ref("photos/"+id).once("value").then(sn=>{
    PH[id]=sn.val()||{}; PHLOAD[id]=1; if(after)after();
  }).catch(()=>{ PH[id]={}; PHLOAD[id]=1; if(after)after(); });
}
function savePhoto(id,pid,obj){
  PH[id]=PH[id]||{}; PH[id][pid]=obj; PHLOAD[id]=1;
  if(DB) DB.ref(`photos/${id}/${pid}`).set(obj).catch(()=>toast("写真を保存できませんでした"));
  else { S.photos=S.photos||{}; S.photos[id]=PH[id]; persist(); }
}
function removePhoto(id,pid){
  if(PH[id]) delete PH[id][pid];
  if(DB) DB.ref(`photos/${id}/${pid}`).remove().catch(()=>{});
  else { if(S.photos&&S.photos[id]) delete S.photos[id][pid]; persist(); }
}
/* 一覧やカードに出す小さい写真を作る */
function makeThumb(dataURI,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height; const sc=Math.min(1,THUMB_MAX/Math.max(w,h));
    w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",THUMB_Q));
  };
  img.onerror=()=>cb(null);
  img.src=dataURI;
}
/* 旧方式（レシピの中に写真を埋め込む）から新方式へ、一度だけ移す */
function pendingMigration(){
  return Object.entries(S.recipes||{}).filter(([id,r])=>r.photos&&Object.keys(r.photos).length);
}
function migratePhotos(){
  const olds=pendingMigration();
  if(!olds.length){ if(window._manualMig){toast("切り替えは済んでいます");window._manualMig=0} return; }
  toast(`写真の保存方法を切り替えています（${olds.length}件）`);
  let done=0;
  olds.forEach(([id,r])=>{
    const entries=Object.entries(r.photos);
    const meta={};
    entries.forEach(([pid,pobj])=>{
      if(pobj&&pobj.img) savePhoto(id,pid,{img:pobj.img,date:pobj.date||key(today)});
      meta[pid]={date:(pobj&&pobj.date)||key(today)};
    });
    const coverId=(r.cover&&r.photos[r.cover])?r.cover
      :entries.sort((a,b)=>((a[1].date||"")<(b[1].date||"")?1:-1))[0][0];
    const src=r.photos[coverId]&&r.photos[coverId].img;
    const finish=thumb=>{
      const nr=Object.assign({},r,{photoMeta:meta,cover:coverId});
      if(thumb) nr.thumb=thumb;
      delete nr.photos;
      saveQuiet(["recipes",id],nr);
      if(++done===olds.length){ render(); toast("写真の保存方法を切り替えました"); }
    };
    if(src) makeThumb(src,finish); else finish(null);
  });
}
function runMigration(){ window._manualMig=1; migratePhotos(); }

/* 分類を廃止する前のデータに残っている「その他」「調味料」などを取り除く */
const OLDCATS=["野菜・大豆製品","調味料","その他","魚","肉","卵"];
function tidyIng(x){
  let n=String(x.n||"").trim(), amt=String(x.amt||"").trim();
  for(const c of OLDCATS){
    if(amt===c){ amt=""; break; }
    if(amt.endsWith(c)){ amt=amt.slice(0,-c.length).trim(); break; }
  }
  // 「パルメザンチーズ 適量 調味料」のように名前へ混ざった場合
  if(!amt&&/\s/.test(n)){
    const parts=n.split(/\s+/);
    if(OLDCATS.includes(parts[parts.length-1])){
      parts.pop();
      if(parts.length>1){ amt=parts.pop(); }
      n=parts.join(" ");
    }
  }
  return {n,amt};
}
function tidyAll(){
  let fixed=0;
  Object.entries(S.recipes||{}).forEach(([id,r])=>{
    if(!r.ing||!r.ing.length)return;
    const before=JSON.stringify(r.ing);
    const after=r.ing.map(tidyIng);
    if(JSON.stringify(after)!==before){
      saveQuiet(["recipes",id],Object.assign({},r,{ing:after})); fixed++;
    }
  });
  return fixed;
}
/* ---------- バックアップ ---------- */
async function allPhotos(){
  if(!DB) return S.photos||{};
  const sn=await DB.ref("photos").once("value");
  return sn.val()||{};
}
async function exportData(withPhotos){
  const btn=$("expBtn"); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> 書き出しています'}
  try{
    const data={ version:1, at:new Date().toISOString(),
      meals:S.meals||{}, recipes:S.recipes||{}, shopping:S.shopping||{}, settings:S.settings||{} };
    if(withPhotos) data.photos=await allPhotos();
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`kondate-backup-${key(today)}${withPhotos?"":"-写真なし"}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("書き出しました");
  }catch(e){ toast("書き出せませんでした: "+e.message); }
  if(btn){btn.disabled=false;btn.textContent="写真ごと書き出す"}
}
function importData(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d=null;
    try{ d=JSON.parse(rd.result); }catch(e){ toast("読み取れないファイルです"); return; }
    if(!d||!d.recipes&&!d.meals){ toast("献立帳のバックアップではないようです"); return; }
    const n=Object.keys(d.recipes||{}).length, m=Object.keys(d.meals||{}).length;
    if(!confirm(`レシピ${n}品・献立${m}日ぶんを読み込みます。\n\n今のデータはすべて置き換わります。よろしいですか？`))return;
    if(!confirm("もう一度確認します。\n現在のデータは元に戻せません。本当に置き換えますか？"))return;
    ["meals","recipes","shopping","settings"].forEach(k=>{ if(d[k]) saveQuiet([k],d[k]); });
    if(d.photos){
      PH={}; PHLOAD={};
      if(DB) DB.ref("photos").set(d.photos).catch(()=>toast("写真を戻せませんでした"));
      else { S.photos=d.photos; persist(); }
    }
    render(); toast("読み込みました");
  };
  rd.readAsText(f);
}
function openBackup(){
  $("sheetBody").innerHTML=`
    <div class="sheetHead"><h3>バックアップ</h3>
      <button class="btn quiet" onclick="closeSheet()">閉じる</button></div>
    <div class="note">献立・レシピ帳・写真をファイルに書き出して残せます。
      iPhoneなら「ファイル」アプリに保存できます。</div>
    <h2 class="sec">書き出す</h2>
    <button class="btn wide" id="expBtn" onclick="exportData(true)">写真ごと書き出す</button>
    <button class="btn wide quiet" style="margin-top:8px" onclick="exportData(false)">写真なしで書き出す（軽い）</button>
    <div class="note" style="margin-top:8px">写真ごとだと時間がかかり、ファイルも大きくなります。

<script>
/* ============================================================
   設定
   ============================================================ */
const PASSCODE   = "morishita";
const WORKER_URL = "https://kondateai.kmorish0619.workers.dev";
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyA4F0Ghm3zHNqbjjTpwPCMI-ISGnHTFtJw",
  authDomain:"kondate-ai2.firebaseapp.com",
  databaseURL:"https://kondate-ai2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"kondate-ai2",
  appId:"1:538385040164:web:43ffa788992ff4f99969b1"
};
const PHOTO_MAX = 1200, PHOTO_Q = 0.7;
const PHOTO_KEEP = 6;   // レシピ1つあたりに残す写真の枚数
const THUMB_MAX  = 480, THUMB_Q = 0.6;   // 一覧に出す小さい写真
/* ============================================================ */

const KINDS=[{k:"main",nm:"主菜"},{k:"side",nm:"副菜"}];
const WD=["日","月","火","水","木","金","土"];

let DB=null, S={meals:{}, recipes:{}, shopping:{}, settings:{adults:2,kids:0}};
let PH={};          // 開いたレシピの写真だけを入れておく置き場
let PHLOAD={};      // 読み込み済みかどうか
const today=new Date();
let view={y:today.getFullYear(),m:today.getMonth()};
let cookView={y:today.getFullYear(),m:today.getMonth()};
let tab="plan", picking=false, picked={}, cookDate=null, lastFill=null, bookQ="", bookSort="at", selDate=null;

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const kindNm=k=>(KINDS.find(x=>x.k===k)||{}).nm||"";
const servings=()=>`大人${S.settings.adults}人${S.settings.kids?`・子ども${S.settings.kids}人`:""}`;
const norm=s=>String(s||"").trim().replace(/\s+/g,"");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- 保存 ---------- */
function setIn(o,p,v){let x=o;for(let i=0;i<p.length-1;i++){if(typeof x[p[i]]!=="object"||x[p[i]]===null)x[p[i]]={};x=x[p[i]]}
  if(v===null||v===undefined)delete x[p[p.length-1]];else x[p[p.length-1]]=v}
function persist(){if(!DB){try{localStorage.setItem("kondate3",JSON.stringify(S))}catch(e){}}}
function save(p,v){setIn(S,p,v);if(DB)DB.ref(p.join("/")).set(v===undefined?null:v).catch(()=>toast("保存できませんでした"));persist();render()}
function saveQuiet(p,v){setIn(S,p,v);if(DB)DB.ref(p.join("/")).set(v===undefined?null:v).catch(()=>{});persist()}
function bootStore(){
  if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL&&window.firebase){
    try{
      firebase.initializeApp(FIREBASE_CONFIG); DB=firebase.database();
      // 写真（photos）は重いので、ここでは読み込まない
      ["meals","recipes","shopping","settings"].forEach(k=>{
        DB.ref(k).on("value",snap=>{
          const v=snap.val();
          S[k]=(k==="settings")?Object.assign({adults:2,kids:0},v||{}):(v||{});
          render();
          // レシピが届いてから一度だけ整える（時間で待つと通信が遅いとき空振りするため）
          if(k==="recipes"&&!window._migrated&&Object.keys(S.recipes).length){
            window._migrated=1;
            setTimeout(()=>{ tidyAll(); migratePhotos(); },400);
          }
        });
      });
      return;
    }catch(e){console.warn(e)}
  }
  try{const r=localStorage.getItem("kondate3");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
  render();
}

/* ---------- 鍵 ---------- */
function tryGate(){if($("gateIn").value.trim()===PASSCODE){try{localStorage.setItem("kondate_ok","1")}catch(e){}openApp()}
  else{$("gateErr").textContent="合い言葉が違います";$("gateIn").value=""}}
$("gateIn").addEventListener("keydown",e=>{if(e.key==="Enter")tryGate()});
function openApp(){$("gate").style.display="none";["hd","app","nav"].forEach(i=>$(i).classList.remove("hidden"));bootStore()}
(function(){try{if(localStorage.getItem("kondate_ok")==="1"){openApp();return}}catch(e){}$("gateIn").focus()})();

/* ============================================================
   レシピ帳 — ここが知識の本体
   献立側は {recipeId, photoId, done} だけを持ち、中身は帳面を見る
   ============================================================ */
function dishData(d){
  if(!d) return null;
  if(d.recipeId){
    const r=S.recipes[d.recipeId];
    if(!r) return {name:"（削除されたレシピ）",missing:true,recipeId:d.recipeId};
    // その日に撮った写真があればそれを、なければ代表写真を出す
    const loaded=photosOf(d.recipeId);
    const own=(d.photoId&&loaded[d.photoId])?loaded[d.photoId].img
      :((d.photoId&&r.photos&&r.photos[d.photoId])?r.photos[d.photoId].img:null);
    return Object.assign({},r,{photo:own||coverOf(r),done:!!d.done,recipeId:d.recipeId,photoId:d.photoId});
  }
  return Object.assign({},d,{photo:d.photo||d.image||null});
}
function findRecipeByName(name){
  const n=norm(name); if(!n) return null;
  for(const id in S.recipes) if(norm(S.recipes[id].name)===n) return id;
  return null;
}
function recipeFields(o){
  return { name:String(o.name||""),
    ing:(o.ing||[]).map(x=>({n:String(x.n||""),amt:String(x.amt||"")})).filter(x=>x.n),
    steps:(o.steps&&o.steps.length)?o.steps.map(String):null,
    tips:o.tips?String(o.tips):null, url:o.url?String(o.url):null,
    image:o.image?String(o.image):null, source:o.source?String(o.source):null,
    time:Number(o.time)||null };
}
/* 献立の1品を帳面に登録する。写真があればそれを1枚目の履歴にする */
function registerRecipe(k,kk){
  const raw=(S.meals[k]||{})[kk]; const d=dishData(raw);
  if(!d||d.recipeId){ toast("もう帳面にあります"); return; }
  const dup=findRecipeByName(d.name);
  if(dup){
    save(["meals",k,kk],{recipeId:dup,done:!!d.done});
    toast("同じ名前が帳面にあったので繋げました"); refreshDay(k); return;
  }
  const id=uid(); const rec=recipeFields(d); rec.at=Date.now();
  let photoId=null;
  if(d.photo){ photoId=uid(); savePhoto(id,photoId,{img:d.photo,date:k});
    rec.photoMeta={[photoId]:{date:k}}; rec.cover=photoId;
    makeThumb(d.photo,t=>{ if(t) saveQuiet(["recipes",id],Object.assign({},S.recipes[id]||rec,{thumb:t})) }); }
  saveQuiet(["recipes",id],rec);
  save(["meals",k,kk], photoId?{recipeId:id,photoId,done:true}:{recipeId:id,done:!!d.done});
  toast("帳面に入れました"); refreshDay(k);
}

/* ---------- 画面切替 ---------- */
function setTab(t){tab=t;picking=false;picked={};closeSheet();render();window.scrollTo(0,0)}
function moveMonth(d){
  if(tab==="cook"){
    const n=new Date(cookView.y,cookView.m+d,1);
    cookView={y:n.getFullYear(),m:n.getMonth()};
    cookDate=key(clampToMonth(cookView)); render(); return;
  }
  const n=new Date(view.y,view.m+d,1); view={y:n.getFullYear(),m:n.getMonth()}; render();
}
/* その月のどの日を開くか。今月なら今日、それ以外は1日 */
function clampToMonth(v){
  return (v.y===today.getFullYear()&&v.m===today.getMonth())
    ? today : new Date(v.y,v.m,1);
}
function titleTap(){ if(tab==="plan"||tab==="cook") openMonthPicker(); }
function backToday(){
  if(tab==="cook"){
    cookView={y:today.getFullYear(),m:today.getMonth()}; cookDate=key(today);
  }else{
    view={y:today.getFullYear(),m:today.getMonth()}; selDate=key(today);
  }
  closeSheet(); render();
}
function pickMonth(y,m){
  if(tab==="cook"){ cookView={y,m}; cookDate=key(clampToMonth(cookView)); }
  else view={y,m};
  closeSheet(); render();
}
function openMonthPicker(){
  const cv=(tab==="cook")?cookView:view, y=cv.y;
  $("sheetBody").innerHTML=`
    <div class="sheetHead"><h3>いつの月を見る？</h3>
      <button class="btn quiet" onclick="closeSheet()">閉じる</button></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="mini line" onclick="pickYear(${y-1})">‹ ${y-1}年</button>
      <b style="font-family:var(--mincho);font-size:20px">${y}年</b>
      <button class="mini line" onclick="pickYear(${y+1})">${y+1}年 ›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
      ${Array.from({length:12},(_,i)=>`<button class="btn ${(y===cv.y&&i===cv.m)?"":"quiet"}"
        style="padding:14px 0" onclick="pickMonth(${y},${i})">${i+1}月</button>`).join("")}
    </div>
    <button class="btn wide ghost" style="margin-top:14px" onclick="backToday()">今日にもどる</button>`;
  $("sheet").classList.add("on"); sheetTop();
}
function pickYear(y){ if(tab==="cook")cookView.y=y; else view.y=y; openMonthPicker(); }
function render(){
  document.documentElement.style.setProperty("--hh",$("hd").offsetHeight+"px");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const mon=(tab==="plan"||tab==="cook");
  $("prevBtn").style.visibility=mon?"visible":"hidden";
  $("nextBtn").style.visibility=mon?"visible":"hidden";
  $("pickBar").classList.toggle("hidden",!picking);
  if(tab==="plan"){$("hTitle").textContent=`${view.y}年 ${view.m+1}月 ▾`;
    $("hSub").textContent=picking?"献立をたてる日をえらぶ":`${countMonth()}品ぶん`;renderPlan()}
  if(tab==="cook"){$("hTitle").textContent=`${cookView.y}年 ${cookView.m+1}月 ▾`;
    $("hSub").textContent=servings();renderCook()}
  if(tab==="buy"){$("hTitle").textContent="買い物リスト";
    const L=S.shopping&&S.shopping.list;
    $("hSub").textContent=(L&&L.from&&L.to)?`${L.from.slice(5).replace("-","/")}〜${L.to.slice(5).replace("-","/")} のぶん`:"まだリストがありません";
    renderBuy()}
  if(tab==="book"){$("hTitle").textContent="レシピ帳";
    $("hSub").textContent=`${Object.keys(S.recipes).length}品たまっています`;renderBook()}
}
function countMonth(){let n=0;for(const k in S.meals){const d=fromKey(k);
  if(d.getFullYear()===view.y&&d.getMonth()===view.m)KINDS.forEach(x=>{const dd=dishData(S.meals[k][x.k]);if(dd&&dd.name)n++})}return n}

/* ---------- 献立タブ ---------- */
function renderPlan(){
  const first=new Date(view.y,view.m,1), start=addDays(first,-first.getDay());
  let cells="";
  for(let i=0;i<42;i++){
    const d=addDays(start,i), k=key(d), day=S.meals[k]||{}, out=d.getMonth()!==view.m, wd=d.getDay();
    let dots="",photo="";
    KINDS.forEach(x=>{const dd=dishData(day[x.k]);if(dd&&dd.name){dots+=`<span class="dot ${x.k}"></span>`;if(dd.photo&&!photo)photo=dd.photo}});
    cells+=`<button class="cell ${out?"out":""} ${k===key(today)?"today":""} ${wd===0?"sun":""} ${wd===6?"sat":""} ${picked[k]?"pick":""} ${(!picking&&k===selDate)?"sel":""}"
      onclick="cellTap('${k}')"><span class="dnum">${d.getDate()}</span><span class="dots">${dots}</span>
      ${photo?`<img class="thumb" src="${photo}" alt="">`:""}${picked[k]?`<span class="check">✓</span>`:""}</button>`;
  }
  const bar=lastFill?`<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px">
      <div style="flex:1;font-size:13px">AIが${lastFill.n}品たてました${lastFill.reused?`（うち${lastFill.reused}品は帳面から）`:""}</div>
      <button class="mini" onclick="undoFill()">取り消す</button>
      <button class="mini" onclick="lastFill=null;render()">閉じる</button></div>`:"";
  const away=(view.y!==today.getFullYear()||view.m!==today.getMonth());
  $("app").innerHTML=`
    ${!picking&&WORKER_URL?`<button class="btn wide" style="margin-bottom:10px" onclick="startPick()">日にちをえらんで献立をたてる</button>`:""}
    ${(!picking&&away)?`<div style="text-align:center;margin-bottom:8px">
      <button class="mini gold" onclick="backToday()">今日にもどる</button></div>`:""}
    ${picking?`<div class="note" style="margin-bottom:9px">必要な日数だけタップ。えらんだ日の空いている枠だけ埋まります。</div>`:""}
    ${bar}
    <div class="week">${WD.map((w,i)=>`<div class="${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}</div>
    <div class="grid">${cells}</div>
    ${(!picking&&selDate)?dayPanel(selDate):`<div class="note" style="text-align:center;margin-top:16px">日付をタップすると、その日の献立が下に出ます</div>`}
    ${picking?"":helpLink()}`;
  if(picking){const n=Object.keys(picked).length;
    $("pickBar").innerHTML=`<button class="btn quiet" onclick="picking=false;picked={};render()">やめる</button>
      <button class="btn" id="genBtn" ${n?"":"disabled"} onclick="generate()">${n}日ぶんの献立をたてる</button>`}
}
/* カレンダーの下に出る、その日の献立 */
function dayPanel(k){
  const d=fromKey(k), day=S.meals[k]||{};
  const rows=KINDS.map(x=>{
    const dd=dishData(day[x.k]);
    if(!dd||!dd.name) return `<div class="prow">
      <span class="pk ${x.k}">${x.nm}</span>
      <button class="padd" onclick="addDish('${k}','${x.k}')">＋ 追加する</button></div>`;
    return `<div class="prow">
      <span class="pk ${x.k}">${x.nm}</span>
      <button class="pnm" onclick="openRecipe('${k}','${x.k}')">${esc(dd.name)}${dd.done?" ✓":""}</button>
      ${WORKER_URL?`<button class="mini line" onclick="swapDish('${k}','${x.k}')">変更</button>`:""}
      <button class="mini line" style="color:var(--danger)" onclick="rmDish('${k}','${x.k}')">外す</button></div>`;
  }).join("");
  return `<div class="card" style="margin-top:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <b style="font-family:var(--mincho);font-size:17px;font-weight:400">${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）</b>
      <button class="mini line" onclick="selDate=null;render()">閉じる</button>
    </div>
    <input class="field" style="margin-bottom:10px" placeholder="（例：鍋の日、カレーの日など）"
      value="${esc(day.label||"")}" onchange="saveLabel('${k}',this.value)">
    ${rows}
    <button class="btn wide quiet" style="margin-top:10px" onclick="cookDate='${k}';setTab('cook')">この日の料理を見る</button>
  </div>`;
}
function startPick(){picking=true;picked={};lastFill=null;render()}
function cellTap(k){
  if(picking){if(picked[k])delete picked[k];else picked[k]=true;render();return}
  selDate=(selDate===k)?null:k; render();
}

/* ---------- AI ---------- */
/* ---------- 楽天レシピAPI ---------- */
let RCATS=null;          // カテゴリ一覧（取得後キャッシュ）
async function rakuten(path,params){
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mode:"rakuten",path,params:params||{}})});
  let d=null;
  try{ d=await r.json(); }catch(e){}
  if(d&&d.error) throw new Error(d.error);
  if(!r.ok) throw new Error("楽天レシピの取得に失敗しました（"+r.status+"）");
  return d||{};
}
async function rakutenCats(){
  if(RCATS) return RCATS;
  // カテゴリは大・中・小をそれぞれ取得する（まとめて取ることはできない）
  const [L,M,SM]=await Promise.all([
    rakuten("CategoryList",{categoryType:"large"}),
    rakuten("CategoryList",{categoryType:"medium"}).catch(()=>null),
    rakuten("CategoryList",{categoryType:"small"}).catch(()=>null)
  ]);
  const out=[], midFull={};
  (((L&&L.result&&L.result.large))||[]).forEach(c=>
    out.push({id:String(c.categoryId),name:c.categoryName,level:1}));
  (((M&&M.result&&M.result.medium))||[]).forEach(c=>{
    const full=`${c.parentCategoryId}-${c.categoryId}`;
    midFull[String(c.categoryId)]=full;
    out.push({id:full,name:c.categoryName,level:2});
  });
  (((SM&&SM.result&&SM.result.small))||[]).forEach(c=>{
    const parent=midFull[String(c.parentCategoryId)];
    if(parent) out.push({id:`${parent}-${c.categoryId}`,name:c.categoryName,level:3});
  });
  RCATS=out;
  return RCATS;
}
function rakutenToDish(x){

async function rakutenRanking(categoryId){

/* 献立づくりの参考にする候補をいくつかのカテゴリから集める */
async function inspirationPool(n){
  try{
    const cats=await rakutenCats();
    if(!cats.length) return [];
    // 中・小カテゴリは料理が具体的なので、そちらを優先してランダムに選ぶ
    const deep=cats.filter(c=>c.level>=2);
    const src=deep.length>8?deep:cats;
    const pick=[...src].sort(()=>Math.random()-0.5).slice(0,n||8);
    const lists=await Promise.all(pick.map(c=>rakutenRanking(c.id).catch(()=>[])));
    const all=[].concat(...lists);
    const seen={}, out=[];
    all.forEach(x=>{const k=norm(x.name); if(k&&!seen[k]){seen[k]=1;out.push(x)}});
    return out;
  }catch(e){ return []; }
}

async function askAI(prompt,system,maxTokens){
  if(!WORKER_URL) throw new Error("WORKER_URLが未設定です");
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-5",max_tokens:maxTokens||2000,system:system||"",messages:[{role:"user",content:prompt}]})});
  if(!r.ok) throw new Error("AIの呼び出しに失敗しました（"+r.status+"）");
  const d=await r.json();
  return (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
function parseJSON(t){
  const s=t.replace(/```json|```/g,"").trim();
  const a=s.indexOf("{"),b=s.indexOf("[");
  const i=(a<0)?b:(b<0)?a:Math.min(a,b);
  const body=i>0?s.slice(i):s;
  try{ return JSON.parse(body); }catch(e){}
  // 応答が途中で切れた場合、読める範囲だけ拾う
  if(body.trim()[0]==="["){
    const out=[];
    const re=/\{[^{}]*\}/g; let m;
    while((m=re.exec(body))){ try{ out.push(JSON.parse(m[0])) }catch(e2){} }
    if(out.length) return out;
  }
  const peek=body.replace(/\s+/g," ").slice(0,90);
  throw new Error("提案を読み取れませんでした: "+(peek||"応答が空でした"));
}
const CHEF="あなたは日本の家庭料理に詳しい献立プランナーです。平日に無理なく作れる現実的な料理を選びます。";

/* AIの提案を献立に入れる。同じ名前が帳面にあれば、AIの中身は捨てて帳面を使う */
let RPOOL=[];   // 直近に取得した楽天レシピの候補
/* AIからは料理名だけを受け取り、中身は「レシピ帳」か「楽天の候補」から引く */
function adopt(o){
  const obj=(typeof o==="string")?{name:o}:(o||{});
  if(!obj.name) return null;
  const id=findRecipeByName(obj.name);
  if(id) return {dish:{recipeId:id}, reused:true, fromBook:true};
  const hit=RPOOL.find(x=>norm(x.name)===norm(obj.name));
  if(hit){
    const r=recipeFields(hit);
    return {dish:r, reused:false, fromPool:true};
  }
  return {dish:recipeFields(obj), reused:false};
}
async function generate(){
  const dates=Object.keys(picked).sort();
  const targets=dates.map(k=>{const day=S.meals[k]||{};
    return {k, need:KINDS.filter(x=>{const dd=dishData(day[x.k]);return !(dd&&dd.name)}).map(x=>x.k)}
  }).filter(t=>t.need.length);
  if(!targets.length){toast("えらんだ日はもう埋まっています");return}

  const b=$("genBtn"); b.disabled=true;
  const prev={}; let n=0, reused=0, failed=0;
  try{
    RPOOL=await inspirationPool(14);
    // 一度に頼む量が多いと応答が途中で切れるので、3日ずつに分けて頼む
    const chunks=[];
    for(let i=0;i<targets.length;i+=3) chunks.push(targets.slice(i,i+3));
    for(let ci=0;ci<chunks.length;ci++){
      b.innerHTML=`<span class="spin"></span> 考えています（${ci+1}／${chunks.length}）`;
      try{

          if(!(p.date in prev)) prev[p.date]=S.meals[p.date]?JSON.parse(JSON.stringify(S.meals[p.date])):null;
          const day=JSON.parse(JSON.stringify(S.meals[p.date]||{}));
          t.need.forEach(kk=>{const a=adopt(p[kk]); if(!a)return;
            day[kk]=a.dish; n++; if(a.reused||a.fromPool)reused++;});
          saveQuiet(["meals",p.date],day);
        });
      }catch(e){ failed++; console.warn(e); if(chunks.length===1) throw e; }
    }
    lastFill=n?{n,reused,prev}:null; picking=false; picked={}; render();
    toast(n? (failed?`${n}品たてました（一部できませんでした）`:`${n}品たてました`) : "提案を受け取れませんでした");
  }catch(e){
    toast(e.message);
    const bb=$("genBtn"); if(bb){bb.disabled=false;bb.textContent="献立をたてる"}
  }
}

/* シートの中身が差し替わるたびに、見出しを固定して残りをスクロール領域にまとめる */
(function(){
  const box=$("sheetBody");
  const mo=new MutationObserver(()=>{
    const head=box.querySelector(":scope > .sheetHead");
    if(!head) return;
    const rest=[...box.children].filter(el=>el!==head);
    if(rest.length===1&&rest[0].classList.contains("sheetScroll")) return;
    mo.disconnect();
    const wrap=document.createElement("div");
    wrap.className="sheetScroll";
    rest.forEach(el=>wrap.appendChild(el));
    box.appendChild(wrap);
    mo.observe(box,{childList:true});
  });
  mo.observe(box,{childList:true});
})();

function saveDish(k,kk){
  const name=$("eN").value.trim(); if(!name){toast("料理名を入れてください");return}
  const raw=(S.meals[k]||{})[kk]||{}, cur=dishData(raw)||{};
  const o={ name,
    ing:$("eI").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split(/[,、]/).map(x=>x.trim());
      return {n:p[0],amt:p[1]||""};
    }).filter(x=>x.n),
    steps:$("eS").value.split("\n").map(l=>l.trim()).filter(Boolean),
    tips:$("eP").value.trim(), url:$("eU").value.trim(),
    time:Number($("eT").value)||null };
  const f=recipeFields(o);
  if(cur.recipeId){
    // 帳面を更新（写真の履歴はそのまま残す）
    const r=S.recipes[cur.recipeId];
    saveQuiet(["recipes",cur.recipeId],Object.assign({},r,f));
    save(["meals",k,kk],raw);
    toast("レシピ帳を更新しました");
  }else{
    // 帳面にない → 自動で登録する
    const dup=findRecipeByName(name);
    if(dup){
      saveQuiet(["recipes",dup],Object.assign({},S.recipes[dup],f));
      save(["meals",k,kk],{recipeId:dup,done:!!cur.done});
      toast("同じ名前の帳面を更新しました");
    }else{
      const id=uid(); const rec=Object.assign({at:Date.now()},f);
      let photoId=null;
      if(cur.photo){ photoId=uid(); savePhoto(id,photoId,{img:cur.photo,date:k});
        rec.photoMeta={[photoId]:{date:k}}; rec.cover=photoId;
        makeThumb(cur.photo,t=>{ if(t) saveQuiet(["recipes",id],Object.assign({},S.recipes[id]||rec,{thumb:t})) }); }
      saveQuiet(["recipes",id],rec);
      save(["meals",k,kk],photoId?{recipeId:id,photoId,done:true}:{recipeId:id,done:!!cur.done});
      toast("レシピ帳に登録しました");
    }
  }
  refreshDay(k);
}

/* ---------- 写真 ---------- */
function pickPhoto(ev,k,kk){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  toast("写真を縮めています…");
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    let w=img.width,h=img.height; const sc=Math.min(1,PHOTO_MAX/Math.max(w,h));
    w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    const data=cv.toDataURL("image/jpeg",PHOTO_Q);
    const raw=(S.meals[k]||{})[kk]||{};
    const rid=raw.recipeId;
    if(rid&&S.recipes[rid]){
      ensurePhotos(rid,()=>{
        const r=JSON.parse(JSON.stringify(S.recipes[rid]));
        const pid=uid();
        savePhoto(rid,pid,{img:data,date:k});
        const meta=Object.assign({},r.photoMeta||{}); meta[pid]={date:k};
        // 枚数を超えたら、代表写真を残して古いものから消す
        const ids=Object.entries(meta).sort((a,b)=>((a[1].date||"")<(b[1].date||"")?1:-1));
        if(ids.length>PHOTO_KEEP){
          ids.filter(([i])=>i!==r.cover).slice(PHOTO_KEEP-(r.cover?1:0))
            .forEach(([i])=>{delete meta[i]; removePhoto(rid,i)});
        }
        r.photoMeta=meta; r.cooked=(r.cooked||0)+((raw.done)?0:1);
        delete r.photos;
        if(!r.cover) r.cover=pid;
        const commit=thumb=>{
          if(thumb&&r.cover===pid) r.thumb=thumb;
          saveQuiet(["recipes",rid],r);
          save(["meals",k,kk],Object.assign({},raw,{photoId:pid,done:true}));
          refreshDay(k); toast(`約${Math.round(data.length/1400)}KBで保存しました`);
        };
        if(r.cover===pid) makeThumb(data,commit); else commit(null);
      });
    }else{
      save(["meals",k,kk],Object.assign({},raw,{photo:data,done:true}));
      refreshDay(k); toast(`約${Math.round(data.length/1400)}KBで保存しました`);
    }
  };img.src=rd.result};
  rd.readAsDataURL(f);
}

/* 料理タブは左右にフリックして日付を移動できる */
(function(){
  let x0=null,y0=null;
  const ok=e=>tab==="cook"&&!$("sheet").classList.contains("on")
    &&!e.target.closest("nav,.strip,input,select,textarea");
  document.addEventListener("touchstart",e=>{
    if(e.touches.length!==1||!ok(e)){x0=null;return}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(x0===null||tab!=="cook")return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;  // 縦スクロールと区別する
    shiftCook(dx<0?1:-1);
  },{passive:true});
})();

/* ---------- 写真は必要になったときだけ読む ---------- */
function photosOf(id){ return PH[id]||{}; }
function ensurePhotos(id,after){
  if(PHLOAD[id]){ if(after)after(); return; }
  if(!DB){ PH[id]=(S.photos&&S.photos[id])||{}; PHLOAD[id]=1; if(after)after(); return; }
  DB.ref("photos/"+id).once("value").then(sn=>{
    PH[id]=sn.val()||{}; PHLOAD[id]=1; if(after)after();
  }).catch(()=>{ PH[id]={}; PHLOAD[id]=1; if(after)after(); });
}
function savePhoto(id,pid,obj){
  PH[id]=PH[id]||{}; PH[id][pid]=obj; PHLOAD[id]=1;
  if(DB) DB.ref(`photos/${id}/${pid}`).set(obj).catch(()=>toast("写真を保存できませんでした"));
  else { S.photos=S.photos||{}; S.photos[id]=PH[id]; persist(); }
}
function removePhoto(id,pid){
  if(PH[id]) delete PH[id][pid];
  if(DB) DB.ref(`photos/${id}/${pid}`).remove().catch(()=>{});
  else { if(S.photos&&S.photos[id]) delete S.photos[id][pid]; persist(); }
}
/* 一覧やカードに出す小さい写真を作る */
function makeThumb(dataURI,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height; const sc=Math.min(1,THUMB_MAX/Math.max(w,h));
    w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",THUMB_Q));
  };
  img.onerror=()=>cb(null);
  img.src=dataURI;
}
/* 旧方式（レシピの中に写真を埋め込む）から新方式へ、一度だけ移す */
function pendingMigration(){
  return Object.entries(S.recipes||{}).filter(([id,r])=>r.photos&&Object.keys(r.photos).length);
}
function migratePhotos(){
  const olds=pendingMigration();
  if(!olds.length){ if(window._manualMig){toast("切り替えは済んでいます");window._manualMig=0} return; }
  toast(`写真の保存方法を切り替えています（${olds.length}件）`);
  let done=0;
  olds.forEach(([id,r])=>{
    const entries=Object.entries(r.photos);
    const meta={};
    entries.forEach(([pid,pobj])=>{
      if(pobj&&pobj.img) savePhoto(id,pid,{img:pobj.img,date:pobj.date||key(today)});
      meta[pid]={date:(pobj&&pobj.date)||key(today)};
    });
    const coverId=(r.cover&&r.photos[r.cover])?r.cover
      :entries.sort((a,b)=>((a[1].date||"")<(b[1].date||"")?1:-1))[0][0];
    const src=r.photos[coverId]&&r.photos[coverId].img;
    const finish=thumb=>{
      const nr=Object.assign({},r,{photoMeta:meta,cover:coverId});
      if(thumb) nr.thumb=thumb;
      delete nr.photos;
      saveQuiet(["recipes",id],nr);
      if(++done===olds.length){ render(); toast("写真の保存方法を切り替えました"); }
    };
    if(src) makeThumb(src,finish); else finish(null);
  });
}
function runMigration(){ window._manualMig=1; migratePhotos(); }

/* 分類を廃止する前のデータに残っている「その他」「調味料」などを取り除く */
const OLDCATS=["野菜・大豆製品","調味料","その他","魚","肉","卵"];
function tidyIng(x){
  let n=String(x.n||"").trim(), amt=String(x.amt||"").trim();
  for(const c of OLDCATS){
    if(amt===c){ amt=""; break; }
    if(amt.endsWith(c)){ amt=amt.slice(0,-c.length).trim(); break; }
  }
  // 「パルメザンチーズ 適量 調味料」のように名前へ混ざった場合
  if(!amt&&/\s/.test(n)){
    const parts=n.split(/\s+/);
    if(OLDCATS.includes(parts[parts.length-1])){
      parts.pop();
      if(parts.length>1){ amt=parts.pop(); }
      n=parts.join(" ");
    }
  }
  return {n,amt};
}
function tidyAll(){
  let fixed=0;
  Object.entries(S.recipes||{}).forEach(([id,r])=>{
    if(!r.ing||!r.ing.length)return;
    const before=JSON.stringify(r.ing);
    const after=r.ing.map(tidyIng);
    if(JSON.stringify(after)!==before){
      saveQuiet(["recipes",id],Object.assign({},r,{ing:after})); fixed++;
    }
  });
  return fixed;
}

async function allPhotos(){

async function exportData(withPhotos){
  const btn=$("expBtn"); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> 書き出しています'}
  try{
    const data={ version:1, at:new Date().toISOString(),
      meals:S.meals||{}, recipes:S.recipes||{}, shopping:S.shopping||{}, settings:S.settings||{} };
    if(withPhotos) data.photos=await allPhotos();
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`kondate-backup-${key(today)}${withPhotos?"":"-写真なし"}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("書き出しました");
  }catch(e){ toast("書き出せませんでした: "+e.message); }
  if(btn){btn.disabled=false;btn.textContent="写真ごと書き出す"}
}
function importData(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d=null;
    try{ d=JSON.parse(rd.result); }catch(e){ toast("読み取れないファイルです"); return; }
    if(!d||!d.recipes&&!d.meals){ toast("献立帳のバックアップではないようです"); return; }
    const n=Object.keys(d.recipes||{}).length, m=Object.keys(d.meals||{}).length;
    if(!confirm(`レシピ${n}品・献立${m}日ぶんを読み込みます。\n\n今のデータはすべて置き換わります。よろしいですか？`))return;
    if(!confirm("もう一度確認します。\n現在のデータは元に戻せません。本当に置き換えますか？"))return;
    ["meals","recipes","shopping","settings"].forEach(k=>{ if(d[k]) saveQuiet([k],d[k]); });
    if(d.photos){
      PH={}; PHLOAD={};
      if(DB) DB.ref("photos").set(d.photos).catch(()=>toast("写真を戻せませんでした"));
      else { S.photos=d.photos; persist(); }
    }
    render(); toast("読み込みました");
  };
  rd.readAsText(f);
}

function startList(){
  const n=(S.shopping&&S.shopping.days)||7;
  const off=(S.shopping&&S.shopping.offset)||0;
  const items={};
  for(let i=0;i<n;i++){
    const d=addDays(today,off+i), k=key(d), day=S.meals[k]; if(!day)continue;
    KINDS.forEach(x=>{const dd=dishData(day[x.k]);
      if(!dd||dd.done||!dd.ing)return;
      dd.ing.forEach(ing=>{
        const hit=Object.values(items).find(z=>z.n===ing.n);
        const when=`${d.getMonth()+1}/${d.getDate()} ${dd.name}`;
        if(hit){ if(ing.amt)hit.amts.push(ing.amt); hit.srcs.push(when); }
        else items[uid()]={n:ing.n,amts:ing.amt?[ing.amt]:[],srcs:[when],done:false};
      });
    });
  }
  const clean={};
  Object.entries(items).forEach(([id,x])=>{
    clean[id]={n:x.n,amt:x.amts.join(" + "),src:x.srcs.join("・"),done:false};
  });
  save(["shopping","list"],{from:key(addDays(today,off)),to:key(addDays(today,off+n-1)),at:Date.now(),items:clean});
  toast(Object.keys(clean).length?`${Object.keys(clean).length}品のリストを作りました`:"対象の材料がありませんでした");
}
function finishList(){
  if(!confirm("この買い物リストを閉じますか？\n（チェックの状態は消えます）"))return;
  save(["shopping","list"],null); toast("おつかれさま");
}
function addBuy(){
  const v=$("buyIn").value.trim(); if(!v)return;
  if(!(S.shopping&&S.shopping.list)){toast("先にリストを作ってください");return}
  save(["shopping","list","items",uid()],{n:v,amt:"",done:false,manual:true});
}
function tickItem(id){
  const x=(((S.shopping||{}).list||{}).items||{})[id]; if(!x)return;
  save(["shopping","list","items",id],Object.assign({},x,{done:!x.done}));
}
function shareBuy(){
  const L=S.shopping&&S.shopping.list; if(!L)return;
  const lines=Object.values(L.items||{}).filter(x=>!x.done)
    .map(x=>"・"+x.n+(x.amt?" "+x.amt:""));
  const txt=lines.join("\n")||"買うものはありません";
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("コピーしました"));
  else toast("共有できませんでした");
}

function coverOf(r){
  if(r.thumb) return r.thumb;                 // 一覧用の小さい写真
  if(r.photos){                                // 切り替え前のデータ
    if(r.cover&&r.photos[r.cover]) return r.photos[r.cover].img;
    const ph=Object.values(r.photos).sort((a,b)=>(a.date<b.date?1:-1));
    if(ph[0]) return ph[0].img;
  }
  return r.image||null;   // 自分の写真がなければ楽天レシピの画像
}
/* そのレシピの写真を、新しい順に並べて返す（読み込み済みのものだけ） */
function photoList(id,r){
  const loaded=photosOf(id);
  const meta=(r&&r.photoMeta)||null;
  if(meta&&Object.keys(meta).length){
    return Object.entries(meta).map(([pid,m])=>
      [pid,{date:m.date,img:(loaded[pid]&&loaded[pid].img)||null}])
      .sort((a,b)=>((a[1].date||"")<(b[1].date||"")?1:-1));
  }
  if(r&&r.photos) return Object.entries(r.photos).sort((a,b)=>((a[1].date||"")<(b[1].date||"")?1:-1));
  return [];
}
function photoCount(r){
  if(r&&r.photoMeta) return Object.keys(r.photoMeta).length;
  if(r&&r.photos) return Object.keys(r.photos).length;
  return 0;
}

    <div class="lbl" style="margin-top:12px">参考URL</div><input class="field" id="eU" type="url" value="${esc(r.url||"")}">
    <button class="btn wide" style="margin-top:14px" onclick="saveBook('${id}')">保存</button>`;
  $("sheet").classList.add("on"); sheetTop();
}
function setPhotoDate(id,pid,v){
  if(!v)return;
  const r=JSON.parse(JSON.stringify(S.recipes[id]));
  if(r.photoMeta&&r.photoMeta[pid]) r.photoMeta[pid].date=v;
  if(r.photos&&r.photos[pid]) r.photos[pid].date=v;
  if(PH[id]&&PH[id][pid]){ PH[id][pid].date=v; savePhoto(id,pid,PH[id][pid]); }
  saveQuiet(["recipes",id],r); render(); editBook(id); toast("日付を変えました");
}
function setCover(id,pid){
  const r=JSON.parse(JSON.stringify(S.recipes[id])); r.cover=pid;
  const src=(photosOf(id)[pid]||{}).img||((r.photos||{})[pid]||{}).img;
  const done=thumb=>{ if(thumb)r.thumb=thumb; saveQuiet(["recipes",id],r);
    render(); editBook(id); toast("代表写真にしました"); };
  if(src) makeThumb(src,done); else done(null);
}
/* 写真がいっぱいのときは、どれを消すか選んでもらう */
let pendingPhoto=null;
function addBookPhoto(ev,id){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  toast("写真を縮めています…");
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    let w=img.width,h=img.height; const sc=Math.min(1,PHOTO_MAX/Math.max(w,h));
    w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    const data=cv.toDataURL("image/jpeg",PHOTO_Q);

  };img.src=rd.result};
  rd.readAsDataURL(f);
}
function commitPhoto(id,data,dropId){
  const r=JSON.parse(JSON.stringify(S.recipes[id]));
  const meta=Object.assign({},r.photoMeta||{});
  if(dropId){ delete meta[dropId]; removePhoto(id,dropId); if(r.cover===dropId) delete r.cover; }
  const pid=uid();
  savePhoto(id,pid,{img:data,date:key(today)});
  meta[pid]={date:key(today)};
  r.photoMeta=meta; delete r.photos;
  const done=thumb=>{ if(!r.cover){r.cover=pid; if(thumb)r.thumb=thumb;}
    saveQuiet(["recipes",id],r); render(); };
  if(!r.cover) makeThumb(data,done); else done(null);
}
function askWhichToDrop(id,data){
  const r=S.recipes[id];
  const ph=photoList(id,r);
  $("sheetBody").innerHTML=`
    <div class="sheetHead"><h3>写真がいっぱいです</h3>
      <button class="btn quiet" onclick="pendingPhoto=null;editBook('${id}')">やめる</button></div>
    <div class="note">${PHOTO_KEEP}枚まで保存できます。どれと入れ替えますか？</div>
    <div class="photoStrip" style="margin-top:10px">
      <figure><img src="${data}" alt="" style="outline:3px solid var(--yuzu);outline-offset:-3px">
        <figcaption>追加する写真</figcaption></figure></div>
    <h2 class="sec">入れ替えて消す写真をえらぶ</h2>
    <div class="card">${ph.map(([pid,p])=>`<div class="item" style="align-items:center">
      <img src="${p.img}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none">
      <div class="grow"><div class="t">${esc(p.date.replace(/-/g,"/"))}${r.cover===pid?"　★代表":""}</div></div>
      <button class="mini line" style="color:var(--danger)" onclick="dropAndAdd('${id}','${pid}')">これを消す</button>
      </div>`).join("")}</div>`;
  sheetTop();
}
function dropAndAdd(id,pid){
  if(!pendingPhoto)return;
  commitPhoto(id,pendingPhoto.data,pid); pendingPhoto=null;
  editBook(id); toast("入れ替えました");
}
function delBookPhoto(id,pid){
  if(!confirm("この写真を削除しますか？"))return;
  const r=JSON.parse(JSON.stringify(S.recipes[id]));
  const meta=Object.assign({},r.photoMeta||{}); delete meta[pid];
  removePhoto(id,pid);
  if(r.photos) delete r.photos[pid];
  if(r.cover===pid){ delete r.cover; delete r.thumb; }
  r.photoMeta=meta;
  saveQuiet(["recipes",id],r); render(); editBook(id); toast("削除しました");
}
function saveBook(id){
  const name=$("eN").value.trim(); if(!name){toast("料理名を入れてください");return}
  const f=recipeFields({ name,
    ing:$("eI").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split(/[,、]/).map(x=>x.trim());return {n:p[0],amt:p[1]||""}}).filter(x=>x.n),
    steps:$("eS").value.split("\n").map(l=>l.trim()).filter(Boolean),
    tips:$("eP").value.trim(), url:$("eU").value.trim(),
    time:$("eT").value });
  save(["recipes",id],Object.assign({},S.recipes[id],f));
  openBook(id); toast("保存しました");
}
function delBook(id){
  const r=S.recipes[id]; if(!r)return;
  // この料理を使っている献立を数える
  let used=0;
  Object.keys(S.meals).forEach(k=>KINDS.forEach(x=>{
    const d=S.meals[k][x.k]; if(d&&d.recipeId===id)used++;}));
  if(!confirm(`「${r.name}」をレシピ帳から削除しますか？\n${used?`献立に入っている${used}件には、いまの内容がそのまま残ります。`:""}`))return;
  // 献立側に中身を写してから消す（過去の記録が読めなくならないように）
  Object.keys(S.meals).forEach(k=>{
    let changed=false;
    const day=JSON.parse(JSON.stringify(S.meals[k]));
    KINDS.forEach(x=>{
      const d=day[x.k]; if(!d||d.recipeId!==id)return;
      const copy=recipeFields(r);
      const ph=(d.photoId&&photosOf(id)[d.photoId])?photosOf(id)[d.photoId].img:coverOf(r);
      if(ph) copy.photo=ph;
      copy.done=!!d.done;
      day[x.k]=copy; changed=true;
    });
    if(changed) saveQuiet(["meals",k],day);
  });
  if(DB) DB.ref("photos/"+id).remove().catch(()=>{});
  delete PH[id]; delete PHLOAD[id];
  save(["recipes",id],null); closeSheet(); toast("レシピ帳から削除しました");
}
function bookToMeal(id){
  $("sheetBody").innerHTML=`
    <div class="sheetHead"><h3>いつの献立に入れる？</h3>
      <button class="btn quiet" onclick="openBook('${id}')">戻る</button></div>
    <div class="lbl">日付</div><input class="field" id="rD" type="date" value="${key(today)}">
    <div class="lbl" style="margin-top:12px">枠</div>
    <select class="field" id="rK">${KINDS.map(x=>`<option value="${x.k}">${x.nm}</option>`).join("")}</select>
    <button class="btn wide" style="margin-top:14px" onclick="bookToMealGo('${id}')">入れる</button>`;
}
function bookToMealGo(id){
  const k=$("rD").value, kk=$("rK").value;
  if(!k){toast("日付をえらんでください");return}
  const day=JSON.parse(JSON.stringify(S.meals[k]||{})); day[kk]={recipeId:id};
  save(["meals",k],day); closeSheet(); toast(`${k} の${kindNm(kk)}に入れました`);
}

/* ---------- 人気レシピをさがす（楽天レシピ） ---------- */
let catQ="";
async function openSearch(){
  $("sheetBody").innerHTML=`<div class="sheetHead"><h3>人気レシピをさがす</h3>
      <button class="btn quiet" onclick="closeSheet()">閉じる</button></div>
    <div class="note"><span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#16324F"></span> カテゴリを読み込んでいます</div>`;
  $("sheet").classList.add("on"); sheetTop();
  try{
    await rakutenCats();
    catQ=""; drawCats();
  }catch(e){
    $("sheetBody").innerHTML=`<div class="sheetHead"><h3>人気レシピをさがす</h3>
      <button class="btn quiet" onclick="closeSheet()">閉じる</button></div>
      <div class="empty">${esc(e.message)}</div>`;
  }
}
function drawCats(){
  $("sheetBody").innerHTML=`<div class="sheetHead"><h3>人気レシピをさがす</h3>
      <button class="btn quiet" onclick="closeSheet()">閉じる</button></div>
    <input class="field" id="catQ" placeholder="カテゴリ名でさがす（例：鶏肉、パスタ）" value="${esc(catQ)}"
      oninput="catQ=this.value;drawCatList()" style="margin-bottom:6px">
    <div class="note">大きな分類を選ぶと、その中の細かいカテゴリからまとめて集めます。</div>
    <div id="catList" style="margin-top:8px"></div>`;
  drawCatList(); sheetTop();
}
function drawCatList(){
  const box=$("catList"); if(!box)return;
  const q=norm(catQ);
  let list;
  if(q){
    list=RCATS.filter(c=>norm(c.name).includes(q)).slice(0,60);
  }else{
    list=RCATS.filter(c=>c.level<=2);
  }
  box.innerHTML=list.length?`<div class="card" style="padding:4px 13px">${list.map(c=>`
    <div class="item">
      <div class="grow"><div class="t">${esc(c.name)}</div>
        <div class="s">${c.level===1?"大きな分類":c.level===2?"中分類":"細かい分類"}</div></div>
      <button class="mini" onclick="showRanking('${c.id}','${esc(c.name)}')">見る</button>
    </div>`).join("")}</div>`
    : `<div class="empty">見つかりませんでした</div>`;
}
let RLIST=[];
async function showRanking(catId,catName){
  $("sheetBody").innerHTML=`<div class="sheetHead"><h3>${esc(catName)}</h3>
      <button class="btn quiet" onclick="drawCats()">戻る</button></div>
    <div class="note"><span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#16324F"></span> 読み込んでいます</div>`;
  try{
    // 楽天は1カテゴリ4件までなので、配下のカテゴリからもまとめて集める
    const kids=RCATS.filter(c=>c.id!==catId&&c.id.startsWith(catId+"-"));
    const ids=[catId, ...shuffle(kids).slice(0,7).map(c=>c.id)];
    const lists=await Promise.all(ids.map(id=>rakutenRanking(id).catch(()=>[])));
    const seen={}; RLIST=[];
    [].concat(...lists).forEach(x=>{const k=norm(x.name);
      if(k&&!seen[k]){seen[k]=1;RLIST.push(x)}});
    drawRanking(catId,catName);
  }catch(e){ toast(e.message); }
}
function drawRanking(catId,catName){
  $("sheetBody").innerHTML=`<div class="sheetHead"><h3>${esc(catName)}</h3>
      <button class="btn quiet" onclick="drawCats()">戻る</button></div>
    <div class="note" style="display:flex;justify-content:space-between;align-items:center">
      <span>${RLIST.length}件</span>
      <button class="mini line" onclick="showRanking('${catId}','${esc(catName)}')">別の候補を見る</button></div>
    ${RLIST.length?RLIST.map((x,i)=>`<div class="dish" style="margin-top:10px">
      ${x.image?`<div class="pic"><img src="${esc(x.image)}" alt="${esc(x.name)}"></div>`:""}
      <div class="body">
        <div class="nm">${esc(x.name)}</div>
        <div class="meta">${x.time?`${x.time}分・`:""}${esc((x.ing||[]).slice(0,5).map(m=>m.n).join("、"))}</div>
        <div class="acts" style="margin-top:9px">
          <button class="mini gold" onclick="adoptRakuten(${i})">帳面に入れる</button>
          <a class="mini line" href="${esc(x.url)}" target="_blank" rel="noopener">楽天で見る</a>
        </div>
      </div></div>`).join("")
      :`<div class="empty">レシピが取得できませんでした</div>`}
    <div class="note" style="text-align:center;margin-top:12px">
      <a href="https://recipe.rakuten.co.jp/" target="_blank" rel="noopener">Supported by 楽天レシピ</a></div>`;
  sheetTop();
}
function adoptRakuten(i){
  const x=RLIST[i]; if(!x)return;
  if(findRecipeByName(x.name)){ toast("もう帳面にあります"); return; }
  saveQuiet(["recipes",uid()],Object.assign(recipeFields(x),{at:Date.now()}));
  render(); toast(`「${x.name}」を帳面に入れました`);
}
</script>
